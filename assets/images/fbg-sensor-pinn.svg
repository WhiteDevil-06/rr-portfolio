<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="fbg-bg-clean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A0F" />
      <stop offset="50%" stop-color="#0B1210" />
      <stop offset="100%" stop-color="#060907" />
    </linearGradient>
    <pattern id="fbg-grid-subtle" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(184, 255, 74, 0.04)" stroke-width="1" />
    </pattern>
    <linearGradient id="fbg-text-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B8FF4A" />
      <stop offset="100%" stop-color="#80FF00" />
    </linearGradient>
    <filter id="fbg-glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep dark background with grid -->
  <rect width="800" height="500" fill="url(#fbg-bg-clean)" />
  <rect width="800" height="500" fill="url(#fbg-grid-subtle)" />
  
  <!-- Subtle outer border frame -->
  <rect x="25" y="25" width="750" height="450" fill="none" stroke="rgba(184, 255, 74, 0.12)" stroke-width="1.5" rx="4" />

  <!-- Outer ambient glow text -->
  <text x="400" y="275" font-family="'JetBrains Mono', 'Inter', monospace" font-size="95" font-weight="900" fill="#B8FF4A" text-anchor="middle" letter-spacing="12" opacity="0.25" filter="url(#fbg-glow-filter)">FBG SENSOR</text>

  <!-- Main bold Text -->
  <text x="400" y="275" font-family="'JetBrains Mono', 'Inter', monospace" font-size="95" font-weight="900" fill="url(#fbg-text-glow)" text-anchor="middle" letter-spacing="12">FBG SENSOR</text>
</svg>
