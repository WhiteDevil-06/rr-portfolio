<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0F12" />
      <stop offset="100%" stop-color="#13161A" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg-grad)" />
  <rect width="800" height="500" fill="url(#grid)" />

  <!-- Frame Lines & Crosshairs -->
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
  <path d="M 15 20 H 25 M 20 15 V 25" stroke="#B8FF4A" stroke-width="1.5" />
  <path d="M 775 20 H 785 M 780 15 V 25" stroke="#B8FF4A" stroke-width="1.5" />
  <path d="M 15 480 H 25 M 20 475 V 485" stroke="#B8FF4A" stroke-width="1.5" />
  <path d="M 775 480 H 785 M 780 475 V 485" stroke="#B8FF4A" stroke-width="1.5" />

  <!-- Technical Overlay Labels -->
  <text x="40" y="45" font-family="monospace" font-size="11" fill="#B8FF4A" letter-spacing="1.5">SYS.AGROSORT // 4-DOF ROBOTIC ARM + CNN</text>
  <text x="760" y="45" font-family="monospace" font-size="11" fill="#62666D" text-anchor="end">ESP32-VISION-NODES</text>

  <!-- Robotic Arm Wireframe Schematic -->
  <!-- Base -->
  <rect x="220" y="380" width="160" height="20" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
  <line x1="300" y1="380" x2="300" y2="300" stroke="#F2F0EA" stroke-width="3" />
  <circle cx="300" cy="300" r="12" fill="#13161A" stroke="#B8FF4A" stroke-width="2" />
  
  <!-- Joint 1 & Arm Segment 1 -->
  <line x1="300" y1="300" x2="420" y2="200" stroke="#F2F0EA" stroke-width="3" stroke-dasharray="6,4" />
  <circle cx="420" cy="200" r="10" fill="#13161A" stroke="#B8FF4A" stroke-width="2" />

  <!-- Joint 2 & Arm Segment 2 (Gripper / Camera) -->
  <line x1="420" y1="200" x2="520" y2="260" stroke="#F2F0EA" stroke-width="3" />
  <circle cx="520" cy="260" r="8" fill="#13161A" stroke="#D6A85A" stroke-width="2" />

  <!-- Gripper & Camera Cone -->
  <path d="M 510 270 L 530 270 L 525 290 L 515 290 Z" fill="none" stroke="#B8FF4A" stroke-width="2" />
  <!-- Vision Field Cone -->
  <path d="M 520 290 L 460 380 L 580 380 Z" fill="rgba(184, 255, 74, 0.05)" stroke="rgba(184, 255, 74, 0.3)" stroke-dasharray="3,3" />

  <!-- Target Fruit Object -->
  <circle cx="520" cy="360" r="22" fill="none" stroke="#D6A85A" stroke-width="2" />
  <!-- Bounding Box -->
  <rect x="485" y="325" width="70" height="70" fill="none" stroke="#B8FF4A" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="560" y="340" font-family="monospace" font-size="10" fill="#B8FF4A">CLASS: FRESH (98.4%)</text>
  <text x="560" y="355" font-family="monospace" font-size="10" fill="#9A9DA3">FPS: 28.5 | LATENCY: 34ms</text>

  <!-- ESP32 & Neural Pipeline Diagram Box -->
  <rect x="50" y="100" width="180" height="220" fill="rgba(19, 22, 26, 0.8)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
  <text x="65" y="125" font-family="monospace" font-size="11" fill="#F2F0EA" font-weight="bold">ESP32 CONTROL</text>
  <line x1="65" y1="135" x2="215" y2="135" stroke="rgba(255,255,255,0.1)" />
  
  <text x="65" y="160" font-family="monospace" font-size="10" fill="#9A9DA3">▶ PWM DRIVER (PCA9685)</text>
  <text x="65" y="180" font-family="monospace" font-size="10" fill="#9A9DA3">▶ TEACH & REPEAT MEMORY</text>
  <text x="65" y="200" font-family="monospace" font-size="10" fill="#9A9DA3">▶ WEBSOCKET STREAM</text>
  <text x="65" y="220" font-family="monospace" font-size="10" fill="#B8FF4A">▶ CNN MODEL: MOBILENET</text>

  <rect x="65" y="240" width="150" height="60" fill="#08090B" stroke="#B8FF4A" stroke-width="1" />
  <text x="75" y="260" font-family="monospace" font-size="9" fill="#B8FF4A">STATUS: INFERENCE ACTIVE</text>
  <text x="75" y="278" font-family="monospace" font-size="9" fill="#9A9DA3">SORTED: 1,420 ITEMS</text>

  <!-- Connective Data Lines -->
  <path d="M 230 210 L 300 210 M 520 200 L 680 200 L 680 100" fill="none" stroke="rgba(184, 255, 74, 0.4)" stroke-width="1" stroke-dasharray="4,2" />
  
  <!-- Footer Technical Strip -->
  <text x="40" y="460" font-family="monospace" font-size="10" fill="#62666D">HARDWARE: ESP32 + 4x SERVO | INFERENCE: EDGE IMPULSE / CNN | WEB: VANILLA INTERFACE</text>
</svg>
