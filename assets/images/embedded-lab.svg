<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090B" />
      <stop offset="100%" stop-color="#13161A" />
    </linearGradient>
    <pattern id="grid4" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bg-grad4)" />
  <rect width="800" height="500" fill="url(#grid4)" />
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <text x="40" y="45" font-family="monospace" font-size="11" fill="#B8FF4A" letter-spacing="1.5">EMBEDDED SYSTEMS LAB // RASPBERRY PI 4 + LINUX KERNEL NODE</text>
  <text x="760" y="45" font-family="monospace" font-size="11" fill="#62666D" text-anchor="end">SYSTEMS EXPERIMENTATION</text>

  <!-- Raspberry Pi Board Diagram -->
  <rect x="100" y="100" width="400" height="280" rx="10" fill="#0D0F12" stroke="#B8FF4A" stroke-width="1.5" />
  <text x="120" y="130" font-family="monospace" font-size="12" fill="#F2F0EA" font-weight="bold">RASPBERRY PI 4B (8GB)</text>
  <text x="120" y="145" font-family="monospace" font-size="10" fill="#62666D">MAC: B8:27:EB:4A:8F:90 | IP: 192.168.1.140</text>

  <!-- GPIO Pin Header -->
  <rect x="120" y="165" width="220" height="30" fill="#13161A" stroke="rgba(255,255,255,0.1)" />
  <text x="130" y="184" font-family="monospace" font-size="9" fill="#B8FF4A">40-PIN GPIO ARRAY [I2C, SPI, UART, PWM]</text>

  <!-- Broadcom SoC Chip -->
  <rect x="220" y="220" width="90" height="90" fill="#13161A" stroke="#D6A85A" stroke-width="1.5" />
  <text x="265" y="260" font-family="monospace" font-size="10" fill="#D6A85A" text-anchor="middle">BCM2711</text>
  <text x="265" y="275" font-family="monospace" font-size="8" fill="#9A9DA3" text-anchor="middle">QUAD ARM A72</text>

  <!-- Ports -->
  <rect x="460" y="130" width="30" height="50" fill="#13161A" stroke="rgba(255,255,255,0.2)" />
  <text x="475" y="160" font-family="monospace" font-size="8" fill="#9A9DA3" text-anchor="middle">ETH</text>

  <rect x="460" y="200" width="30" height="50" fill="#13161A" stroke="rgba(255,255,255,0.2)" />
  <text x="475" y="230" font-family="monospace" font-size="8" fill="#9A9DA3" text-anchor="middle">USB3</text>

  <rect x="460" y="270" width="30" height="50" fill="#13161A" stroke="rgba(255,255,255,0.2)" />
  <text x="475" y="300" font-family="monospace" font-size="8" fill="#9A9DA3" text-anchor="middle">USB2</text>

  <!-- Systems Metrics Window Right -->
  <rect x="540" y="100" width="180" height="280" fill="#0D0F12" stroke="rgba(255,255,255,0.1)" />
  <text x="555" y="130" font-family="monospace" font-size="10" fill="#B8FF4A">LINUX KERNEL LOGS</text>
  <line x1="555" y1="138" x2="705" y2="138" stroke="rgba(255,255,255,0.1)" />

  <text x="555" y="160" font-family="monospace" font-size="9" fill="#9A9DA3">CPU TEMP: 41.2°C</text>
  <text x="555" y="178" font-family="monospace" font-size="9" fill="#9A9DA3">RAM UTIL: 1.8 / 8GB</text>
  <text x="555" y="196" font-family="monospace" font-size="9" fill="#9A9DA3">UPTIME: 14D 08H</text>
  <text x="555" y="214" font-family="monospace" font-size="9" fill="#B8FF4A">DAEMON: ACTIVE</text>

  <rect x="555" y="235" width="150" height="120" fill="#13161A" stroke="rgba(255,255,255,0.06)" />
  <text x="565" y="255" font-family="monospace" font-size="8" fill="#D6A85A">NETWORKING & SSH</text>
  <text x="565" y="270" font-family="monospace" font-size="8" fill="#9A9DA3">WireGuard VPN Tunnel</text>
  <text x="565" y="285" font-family="monospace" font-size="8" fill="#9A9DA3">Custom Systemd Svc</text>
  <text x="565" y="300" font-family="monospace" font-size="8" fill="#9A9DA3">Mqtt Broker Active</text>
  <text x="565" y="315" font-family="monospace" font-size="8" fill="#B8FF4A">Status: 0 Dropouts</text>

  <text x="40" y="460" font-family="monospace" font-size="10" fill="#62666D">SYSTEMS: HEADLESS DEBIAN / ARM64 | NETWORKING | WIREGUARD | SYSTEMD DAEMONS</text>
</svg>
