<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0D10" />
      <stop offset="100%" stop-color="#13161A" />
    </linearGradient>
    <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bg-grad3)" />
  <rect width="800" height="500" fill="url(#grid3)" />
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <text x="40" y="45" font-family="monospace" font-size="11" fill="#B8FF4A" letter-spacing="1.5">FIBER BRAGG GRATING (FBG) // ML SENSOR DECOUPLING</text>
  <text x="760" y="45" font-family="monospace" font-size="11" fill="#62666D" text-anchor="end">OPTICAL SENSING RESEARCH</text>

  <!-- Fiber Optical Cable Line -->
  <line x1="80" y1="120" x2="720" y2="120" stroke="rgba(255, 255, 255, 0.2)" stroke-width="8" stroke-linecap="round" />
  <line x1="80" y1="120" x2="720" y2="120" stroke="#B8FF4A" stroke-width="2" />
  
  <!-- FBG Sensor Nodes -->
  <rect x="220" y="105" width="60" height="30" fill="#13161A" stroke="#B8FF4A" stroke-width="1.5" />
  <text x="250" y="123" font-family="monospace" font-size="10" fill="#B8FF4A" text-anchor="middle">FBG-1</text>

  <rect x="420" y="105" width="60" height="30" fill="#13161A" stroke="#D6A85A" stroke-width="1.5" />
  <text x="450" y="123" font-family="monospace" font-size="10" fill="#D6A85A" text-anchor="middle">FBG-2</text>

  <rect x="600" y="105" width="60" height="30" fill="#13161A" stroke="#B8FF4A" stroke-width="1.5" />
  <text x="630" y="123" font-family="monospace" font-size="10" fill="#B8FF4A" text-anchor="middle">FBG-3</text>

  <!-- Spectral Waveforms Graph -->
  <rect x="80" y="180" width="640" height="230" fill="#0D0F12" stroke="rgba(255,255,255,0.08)" />
  <text x="100" y="205" font-family="monospace" font-size="10" fill="#9A9DA3">WAVELENGTH SHIFT SPECTRUM (Δλb)</text>

  <!-- Graph Axes -->
  <line x1="120" y1="230" x2="120" y2="380" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  <line x1="120" y1="380" x2="680" y2="380" stroke="rgba(255,255,255,0.1)" stroke-width="1" />

  <!-- Waveform 1 (Temperature) -->
  <path d="M 120 350 Q 200 240 280 350 T 440 350 T 600 350" fill="none" stroke="#B8FF4A" stroke-width="2" />
  <text x="300" y="270" font-family="monospace" font-size="10" fill="#B8FF4A">TEMPERATURE RESPONSE (1550.2nm)</text>

  <!-- Waveform 2 (Strain) -->
  <path d="M 120 370 Q 240 310 360 370 T 520 280 T 680 370" fill="none" stroke="#D6A85A" stroke-width="2" stroke-dasharray="4,2" />
  <text x="500" y="300" font-family="monospace" font-size="10" fill="#D6A85A">STRAIN RESPONSE (CROSS-COUPLED)</text>

  <!-- Decoupling Box -->
  <rect x="420" y="320" width="230" height="50" fill="rgba(8, 9, 11, 0.9)" stroke="#B8FF4A" stroke-width="1" />
  <text x="435" y="340" font-family="monospace" font-size="9" fill="#B8FF4A">ML MODEL: RANDOM FOREST / REGRESSOR</text>
  <text x="435" y="355" font-family="monospace" font-size="9" fill="#9A9DA3">DECOUPLING ACCURACY: R² = 0.994</text>

  <text x="40" y="460" font-family="monospace" font-size="10" fill="#62666D">RESEARCH: FBG OPTICAL SENSING | DUAL-PARAMETER DECOUPLING | PREPROCESSING</text>
</svg>
