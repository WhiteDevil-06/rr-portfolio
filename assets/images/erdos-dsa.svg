<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="erdos-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A0F" />
      <stop offset="100%" stop-color="#0D111A" />
    </linearGradient>
    <pattern id="erdos-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 242, 254, 0.05)" stroke-width="1" />
    </pattern>
    <linearGradient id="node-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#4FACFE" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#erdos-bg)" />
  <rect width="800" height="500" fill="url(#erdos-grid)" />
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="rgba(0, 242, 254, 0.15)" stroke-width="1" />

  <!-- Header -->
  <text x="40" y="45" font-family="monospace" font-size="11" fill="#00F2FE" letter-spacing="1.5">ERDOS // DSA EMERGENCY HEALTHCARE WORKFLOW ENGINE</text>
  <text x="760" y="45" font-family="monospace" font-size="11" fill="#62666D" text-anchor="end">PRIORITY QUEUE · HASH TABLE · LINKED LIST</text>

  <!-- Terminal Window Graphic -->
  <rect x="50" y="70" width="700" height="360" fill="#0A0D14" stroke="rgba(0, 242, 254, 0.2)" stroke-width="1" />
  <rect x="50" y="70" width="700" height="30" fill="#111622" stroke="rgba(0, 242, 254, 0.1)" stroke-width="1" />
  
  <circle cx="70" cy="85" r="5" fill="#FF5F56" />
  <circle cx="85" cy="85" r="5" fill="#FFBD2E" />
  <circle cx="100" cy="85" r="5" fill="#27C93F" />
  <text x="120" y="89" font-family="monospace" font-size="10" fill="#9A9DA3">erdos-dsa ~ hospital_triage_simulation.py</text>

  <!-- Code Log Lines -->
  <text x="70" y="125" font-family="monospace" font-size="12" fill="#00F2FE">$ python -m erdos.triage --simulation="EMERGENCY_ICU"</text>
  <text x="70" y="148" font-family="monospace" font-size="11" fill="#9A9DA3">[INIT] Initializing Custom PatientNode Linked List Audit Trail... OK</text>
  <text x="70" y="168" font-family="monospace" font-size="11" fill="#B8FF4A">[TRIAGE] Min-Heap Priority Queue Active (12 Emergency Nodes Processed)</text>
  <text x="70" y="188" font-family="monospace" font-size="11" fill="#D6A85A">[BED_HASH] Allocating Beds via Hash Table (Collision Resolution: Chaining)</text>

  <!-- Visual Data Structure Diagrams -->
  <!-- Box 1: Priority Queue Min-Heap -->
  <rect x="70" y="215" width="210" height="190" fill="url(#node-glow)" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1" />
  <text x="85" y="235" font-family="monospace" font-size="11" fill="#00F2FE" font-weight="bold">PRIORITY TRIAGE QUEUE</text>
  <text x="85" y="252" font-family="monospace" font-size="9" fill="#62666D">MIN-HEAP SEVERITY ORDER</text>
  
  <!-- Min Heap Nodes -->
  <circle cx="175" cy="280" r="16" fill="#111622" stroke="#FF5F56" stroke-width="2" />
  <text x="175" y="284" font-family="monospace" font-size="10" fill="#FF5F56" text-anchor="middle" font-weight="bold">P1 (0)</text>
  
  <line x1="163" y1="293" x2="135" y2="325" stroke="rgba(0,242,254,0.4)" stroke-width="1.5" />
  <line x1="187" y1="293" x2="215" y2="325" stroke="rgba(0,242,254,0.4)" stroke-width="1.5" />

  <circle cx="125" cy="338" r="14" fill="#111622" stroke="#FFBD2E" stroke-width="2" />
  <text x="125" y="342" font-family="monospace" font-size="9" fill="#FFBD2E" text-anchor="middle">P4 (2)</text>

  <circle cx="225" cy="338" r="14" fill="#111622" stroke="#4FACFE" stroke-width="2" />
  <text x="225" y="342" font-family="monospace" font-size="9" fill="#4FACFE" text-anchor="middle">P2 (3)</text>
  
  <text x="85" y="388" font-family="monospace" font-size="9" fill="#B8FF4A">Root Node: Immediate ICU</text>

  <!-- Box 2: Bed Allocation Hash Table -->
  <rect x="295" y="215" width="210" height="190" fill="url(#node-glow)" stroke="rgba(79, 172, 254, 0.3)" stroke-width="1" />
  <text x="310" y="235" font-family="monospace" font-size="11" fill="#4FACFE" font-weight="bold">BED ALLOCATION MAP</text>
  <text x="310" y="252" font-family="monospace" font-size="9" fill="#62666D">HASH TABLE + CHAINING</text>

  <text x="310" y="280" font-family="monospace" font-size="10" fill="#9A9DA3">Hash(Key: 101) → Bed #A04</text>
  <rect x="310" y="288" width="180" height="18" fill="#162032" stroke="rgba(0,242,254,0.2)" />
  <text x="315" y="301" font-family="monospace" font-size="9" fill="#B8FF4A">[OCCUPIED] Dr. Sharma</text>

  <text x="310" y="325" font-family="monospace" font-size="10" fill="#9A9DA3">Hash(Key: 104) → Bed #B12</text>
  <rect x="310" y="333" width="180" height="18" fill="#162032" stroke="rgba(0,242,254,0.2)" />
  <text x="315" y="346" font-family="monospace" font-size="9" fill="#00F2FE">[ALLOCATED] Vent Unit 2</text>

  <text x="310" y="388" font-family="monospace" font-size="9" fill="#4FACFE">Occupancy: 85.0%</text>

  <!-- Box 3: Patient Arrival Linked List -->
  <rect x="520" y="215" width="210" height="190" fill="url(#node-glow)" stroke="rgba(184, 255, 74, 0.3)" stroke-width="1" />
  <text x="535" y="235" font-family="monospace" font-size="11" fill="#B8FF4A" font-weight="bold">PATIENT LINKED LIST</text>
  <text x="535" y="252" font-family="monospace" font-size="9" fill="#62666D">CHRONOLOGICAL AUDIT</text>

  <!-- Linked List Nodes Graphic -->
  <rect x="535" y="275" width="45" height="30" fill="#162032" stroke="#B8FF4A" stroke-width="1" />
  <text x="557" y="294" font-family="monospace" font-size="9" fill="#B8FF4A" text-anchor="middle">HEAD</text>

  <line x1="580" y1="290" x2="600" y2="290" stroke="#B8FF4A" stroke-width="1.5" marker-end="url(#arrow)" />

  <rect x="605" y="275" width="55" height="30" fill="#162032" stroke="#00F2FE" stroke-width="1" />
  <text x="632" y="294" font-family="monospace" font-size="9" fill="#00F2FE" text-anchor="middle">NODE 1</text>

  <line x1="660" y1="290" x2="680" y2="290" stroke="#00F2FE" stroke-width="1.5" />

  <rect x="685" y="275" width="35" height="30" fill="#162032" stroke="#62666D" stroke-width="1" />
  <text x="702" y="294" font-family="monospace" font-size="9" fill="#62666D" text-anchor="middle">TAIL</text>

  <text x="535" y="340" font-family="monospace" font-size="9" fill="#9A9DA3">Node Count: 128 Patients</text>
  <text x="535" y="358" font-family="monospace" font-size="9" fill="#9A9DA3">Time Complexity: O(1) Push</text>
  <text x="535" y="388" font-family="monospace" font-size="9" fill="#B8FF4A">Audit Log Verified</text>

  <text x="40" y="460" font-family="monospace" font-size="10" fill="#62666D">TAGS: DATA-STRUCTURES | HEALTHCARE-SIMULATION | PRIORITY-QUEUE | LINKED-LIST | HASH-TABLE</text>
</svg>
