<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="erdos-bg-clean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080A0F" />
      <stop offset="50%" stop-color="#0C101A" />
      <stop offset="100%" stop-color="#06080D" />
    </linearGradient>
    <pattern id="erdos-grid-subtle" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0, 242, 254, 0.04)" stroke-width="1" />
    </pattern>
    <linearGradient id="text-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep dark background with grid -->
  <rect width="800" height="500" fill="url(#erdos-bg-clean)" />
  <rect width="800" height="500" fill="url(#erdos-grid-subtle)" />
  
  <!-- Subtle outer border frame -->
  <rect x="25" y="25" width="750" height="450" fill="none" stroke="rgba(0, 242, 254, 0.12)" stroke-width="1.5" rx="4" />

  <!-- Outer ambient glow text -->
  <text x="400" y="275" font-family="'JetBrains Mono', 'Inter', monospace" font-size="110" font-weight="900" fill="#00F2FE" text-anchor="middle" letter-spacing="14" opacity="0.3" filter="url(#glow-filter)">ERDOS</text>

  <!-- Main bold ERDOS Text -->
  <text x="400" y="275" font-family="'JetBrains Mono', 'Inter', monospace" font-size="110" font-weight="900" fill="url(#text-glow)" text-anchor="middle" letter-spacing="14">ERDOS</text>
</svg>
